# Bookstore Inventory - URL routing and log rotation.
# Consumed by the deployment script; see folder2/folder21/file213.log
# for the log output produced under these rules.

server {
    listen 8000;
    server_name localhost;

    # Frontend page
    location / {
        root /srv/bookstore/frontend;
        index file121.html;
    }

    # API endpoints served by file111.py
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

# Rotate weekly sales reports generated into folder3/folder32/
access_log /var/log/bookstore/access.log main;
error_log  /var/log/bookstore/error.log warn;
